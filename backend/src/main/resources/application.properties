spring.application.name=rutaia-backend
server.port=8080

# ---------------------------------------------------------------
# Variables de entorno
# Se importa el .env de la raiz del proyecto (rutaia/.env), el mismo
# que usa Docker. Asi las claves nunca se escriben en el codigo.
# "optional:" evita que falle si el archivo no existe (por ejemplo en
# otro entorno donde las variables se definen en el sistema).
# ---------------------------------------------------------------
spring.config.import=optional:file:../.env[.properties]

# ---------------------------------------------------------------
# Conexion a PostgreSQL (contenedor rutaia-postgres)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---------------------------------------------------------------
# JPA / Hibernate
# validate: las tablas las crea database/schema.sql; Hibernate solo
# comprueba que las entidades Java coincidan con ellas.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------
# Integracion con n8n (flujo RAG de consulta)
# Se puede cambiar con la variable N8N_WEBHOOK_URL del .env.
# Es la URL de PRODUCCION (/webhook/...): el flujo debe estar activo.
# ---------------------------------------------------------------
rutaia.n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/rutaia-consulta}
rutaia.n8n.timeout-segundos=60
