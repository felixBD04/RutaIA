spring.application.name=rutaia-backend
server.port=8080

# Variables de entorno: se lee el .env de la raiz del proyecto
spring.config.import=optional:file:../.env[.properties]

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate: las tablas las crea database/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Integracion con n8n (flujo RAG de consulta)
rutaia.n8n.webhook-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook/rutaia-consulta}
rutaia.n8n.timeout-segundos=60